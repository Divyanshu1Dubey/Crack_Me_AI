name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend Tests & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run Django checks
        run: python manage.py check --deploy 2>&1 || true
      - name: Run migrations check
        run: python manage.py makemigrations --check --dry-run
      - name: Run tests
        run: python manage.py test --verbosity=2
        env:
          DJANGO_SECRET_KEY: test-secret-key-for-ci
          DEBUG: 'False'

  frontend:
    name: Frontend Build & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Security audit
        run: npm audit --audit-level=high || true
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api

  security:
    name: Security Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install security tools
        run: pip install bandit safety
      - name: Bandit SAST scan
        run: bandit -r backend/ -x backend/__pycache__,backend/migrations --skip B101 -f json -o bandit-report.json || true
      - name: Safety dependency check
        run: safety check -r backend/requirements.txt || true

  # Visual regression — runs the Playwright visual-snapshots suite against
  # the production site (cracklabs.app) using a real student account.
  # Baselines live under frontend/tests/e2e/visual-snapshots/ and are
  # updated with --update-snapshots.
  #
  # First-run policy: WARNING-ONLY. Use the `strict-snapshots` workflow
  # input to flip to a hard gate once baselines stabilise.
  visual-snapshots:
    name: Visual Snapshots (Playwright)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install npm dependencies
        run: npm ci
      - name: Install Playwright browser (chromium)
        # Mobile project reuses the same Chromium binary since
        # playwright.config.ts only configures viewport / DSR.
        run: npx playwright install --with-deps chromium
      - name: Run visual snapshots against cracklabs.app
        env:
          BASE_URL: https://cracklabs.app
          PLAYWRIGHT_SKIP_WEBSERVER: '1'
          # Auth secrets: set these in repo Settings → Secrets and variables
          # → Actions so the gated private-page baselines can be taken.
          LIVE_AUDIT_EMAIL: ${{ secrets.LIVE_AUDIT_EMAIL }}
          LIVE_AUDIT_PASSWORD: ${{ secrets.LIVE_AUDIT_PASSWORD }}
          QA_TEST_USER_EMAIL: ${{ secrets.QA_TEST_USER_EMAIL }}
          QA_TEST_USER_PASSWORD: ${{ secrets.QA_TEST_USER_PASSWORD }}
        # First-run policy (warning-only): don't block merge on first
        # generation. Once baselines are stable and committed, flip
        # the workflow_dispatch input or remove the `|| true` to gate.
        # `continue-on-error` lets later steps always upload the report.
        run: npx playwright test visual-snapshots.spec.ts --reporter=line,html || true
        continue-on-error: true
      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-visual-report
          path: frontend/playwright-report/
          retention-days: 14

name: Production Audit

# Playwright suites that exercise the LIVE site (cracklabs.app) with a real
# account. They used to run in ci.yml on every push and pull request, which
# sent production traffic (and recorded answer attempts on the audit account)
# for each commit while never testing the commit's own code. They now run
# weekly and on demand. Both stay warning-only (`|| true` +
# continue-on-error); review the uploaded reports.
#
# Visual baselines under frontend/tests/e2e/visual-snapshots.spec.ts-snapshots/
# are currently *-win32.png only, so on ubuntu runners Playwright writes new
# -linux baselines instead of comparing; regenerate them on Linux (e.g. a
# workflow_dispatch run with --update-snapshots, then commit) before turning
# this into a gate.

on:
  schedule:
    - cron: '30 3 * * 1'   # Mondays 03:30 UTC
  workflow_dispatch:

concurrency:
  group: production-audit
  cancel-in-progress: false

jobs:
  # Visual regression — runs the Playwright visual-snapshots suite against
  # the production site (cracklabs.app) using a real student account.
  visual-snapshots:
    name: Visual Snapshots (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/playwright-setup
      - name: Run visual snapshots against cracklabs.app
        env:
          BASE_URL: https://cracklabs.app
          PLAYWRIGHT_SKIP_WEBSERVER: '1'
          # Auth secrets: set these in repo Settings → Secrets and variables
          # → Actions so the gated private-page baselines can be taken.
          LIVE_AUDIT_EMAIL: ${{ secrets.LIVE_AUDIT_EMAIL }}
          LIVE_AUDIT_PASSWORD: ${{ secrets.LIVE_AUDIT_PASSWORD }}
          QA_TEST_USER_EMAIL: ${{ secrets.QA_TEST_USER_EMAIL }}
          QA_TEST_USER_PASSWORD: ${{ secrets.QA_TEST_USER_PASSWORD }}
        run: npx playwright test visual-snapshots.spec.ts --reporter=line,html || true
        continue-on-error: true
      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-visual-report
          path: frontend/playwright-report/
          retention-days: 14

  # Live audit — runs the production-incident suite from the 2026-07-26
  # audit. Walks 30 questions each on /questions/neet-pg/practice and
  # /questions/inicet/practice (15 desktop + 5 mobile each), records
  # console errors, failed network requests, and missing UI affordances
  # (option buttons, "Why correct" cards, next-question buttons) into
  # frontend/tests/e2e/.audit/bug-report.json. The spec never throws on
  # bugs; it records them for a human to review.
  live-audit:
    name: Live Audit (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/playwright-setup
      - name: Run live audit against cracklabs.app
        env:
          LIVE_AUDIT_BASE_URL: https://cracklabs.app
          BASE_URL: https://cracklabs.app
          PLAYWRIGHT_SKIP_WEBSERVER: '1'
          LIVE_AUDIT_EMAIL: ${{ secrets.LIVE_AUDIT_EMAIL }}
          LIVE_AUDIT_PASSWORD: ${{ secrets.LIVE_AUDIT_PASSWORD }}
        run: npx playwright test live-audit.spec.ts --reporter=line,html --timeout=600000 || true
        continue-on-error: true
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-audit-report
          path: frontend/tests/e2e/.audit/bug-report.json
          retention-days: 30
      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-audit-html
          path: frontend/playwright-report/
          retention-days: 14
          if-no-files-found: ignore

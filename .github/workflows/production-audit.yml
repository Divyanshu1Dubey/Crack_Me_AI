name: Production Audit

# Playwright suites that exercise the LIVE site (cracklabs.app) with a real
# account. They used to run in ci.yml on every push and pull request, which
# sent production traffic (and recorded answer attempts on the audit account)
# for each commit while never testing the commit's own code. They now run
# weekly and on demand. Both stay warning-only (`|| true` +
# continue-on-error); review the job log and the uploaded artifacts.
#
# No credential may reach an artifact: the repository is public and GitHub
# masks secrets in logs only, never inside artifacts.
#   * The HTML (and JSON / blob) report stores every step title, and Playwright
#     titles a fill step with the value it typed: `Fill "<the password>"`. The
#     runs use the line reporter only, and playwright-report/ is never uploaded.
#   * A trace records action parameters (the typed password), every request
#     and response (the Supabase password grant, access and refresh tokens,
#     Bearer headers) and DOM snapshots with input values: `--trace off`.
#   * The "error-context" page snapshot attached to a failed test lists the
#     value of every <input>, password fields included:
#     PLAYWRIGHT_NO_COPY_PROMPT=1 turns it off.
#   * Uploads are allowlists: the live audit's bug-report.json, and the
#     visual-diff and new-baseline PNGs (masked as the spec masks them). Not
#     test-failed-*.png (unmasked failure screenshots of private pages), not
#     test-results/ as a whole, no traces (*.zip), videos (*.webm) or
#     storage-state files.
# If an older run of this workflow uploaded a playwright-report artifact,
# rotate the QA_TEST_USER_* and LIVE_AUDIT_* passwords, sign those accounts out
# of every session, and delete the old artifacts.
#
# Visual baselines under frontend/tests/e2e/visual-snapshots.spec.ts-snapshots/
# are currently *-win32.png only, so on ubuntu runners Playwright writes new
# -linux baselines instead of comparing. The visual job uploads them
# (playwright-visual-new-baselines): review and commit them before turning
# this into a gate.

on:
  schedule:
    - cron: '30 3 * * 1'   # Mondays 03:30 UTC
  workflow_dispatch:

concurrency:
  group: production-audit
  cancel-in-progress: false

jobs:
  # Visual regression — runs the Playwright visual-snapshots suite against
  # the production site (cracklabs.app) using a real student account.
  visual-snapshots:
    name: Visual Snapshots (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/playwright-setup
      - name: Run visual snapshots against cracklabs.app
        env:
          BASE_URL: https://cracklabs.app
          PLAYWRIGHT_SKIP_WEBSERVER: '1'
          PLAYWRIGHT_NO_COPY_PROMPT: '1'
          # Auth secrets: set these in repo Settings → Secrets and variables
          # → Actions so the gated private-page baselines can be taken. The
          # suite logs in as the QA student only (tests/e2e/fixtures/auth.ts).
          QA_TEST_USER_EMAIL: ${{ secrets.QA_TEST_USER_EMAIL }}
          QA_TEST_USER_PASSWORD: ${{ secrets.QA_TEST_USER_PASSWORD }}
        run: npx playwright test visual-snapshots.spec.ts --reporter=line --trace off || true
        continue-on-error: true
      - name: Upload visual diffs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-visual-diffs
          path: |
            frontend/test-results/**/*-actual.png
            frontend/test-results/**/*-expected.png
            frontend/test-results/**/*-diff.png
          retention-days: 14
          if-no-files-found: ignore
      - name: Upload new baselines
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-visual-new-baselines
          path: frontend/tests/e2e/visual-snapshots.spec.ts-snapshots/*-linux.png
          retention-days: 14
          if-no-files-found: ignore

  # Live audit — runs the production-incident suite from the 2026-07-26
  # audit. Walks 30 questions each on /questions/neet-pg/practice and
  # /questions/inicet/practice (15 desktop + 5 mobile each), records
  # console errors, failed network requests, and missing UI affordances
  # (option buttons, "Why correct" cards, next-question buttons) into
  # frontend/tests/e2e/.audit/bug-report.json. The spec never throws on
  # bugs; it records them for a human to review.
  live-audit:
    name: Live Audit (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/playwright-setup
      - name: Run live audit against cracklabs.app
        env:
          LIVE_AUDIT_BASE_URL: https://cracklabs.app
          BASE_URL: https://cracklabs.app
          PLAYWRIGHT_SKIP_WEBSERVER: '1'
          PLAYWRIGHT_NO_COPY_PROMPT: '1'
          LIVE_AUDIT_EMAIL: ${{ secrets.LIVE_AUDIT_EMAIL }}
          LIVE_AUDIT_PASSWORD: ${{ secrets.LIVE_AUDIT_PASSWORD }}
        run: npx playwright test live-audit.spec.ts --reporter=line --trace off --timeout=600000 || true
        continue-on-error: true
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: live-audit-report
          path: frontend/tests/e2e/.audit/bug-report.json
          retention-days: 30
          if-no-files-found: ignore

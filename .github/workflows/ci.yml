name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend Tests & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run Django checks
        run: python manage.py check --deploy 2>&1
        env:
          SECRET_KEY: ci-secret-key-12345
          DJANGO_SECRET_KEY: test-secret-key-for-ci
      - name: Run migrations check
        run: python manage.py makemigrations --check --dry-run
        env:
          SECRET_KEY: ci-secret-key-12345
          DJANGO_SECRET_KEY: test-secret-key-for-ci
      - name: Run tests
        run: python manage.py test --verbosity=2
        env:
          SECRET_KEY: ci-secret-key-12345
          DJANGO_SECRET_KEY: test-secret-key-for-ci
          DEBUG: 'False'

  frontend:
    name: Frontend Build & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Security audit
        run: npm audit --audit-level=high
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api

  frontend-unit:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      # node --test runs the TypeScript tests directly: Node >= 22.18 strips
      # types natively (the build job stays on Node 20). check-latest makes
      # setup-node resolve the newest 22.x instead of an older 22.x that may
      # be cached on the runner image.
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          check-latest: true
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Unit tests (tests/unit)
        run: npm run test:unit

  # Its own job: a finding fails this job only, so the Bandit SAST report and
  # gate in `security` still run (as one step of that job, a failing scan
  # skipped every later step).
  secret-scan:
    name: Secret and Personal-Data Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      # Blocking: credentials and personal-data dumps in any tracked file
      # (the pre-commit hook is opt-in). Output shows labels and lengths only.
      - name: Secret and personal-data scan
        run: python scripts/scan_secrets.py --all-tracked

  security:
    name: Security Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install security tools
        run: pip install bandit safety
      # Full report (every severity and confidence) for review; never fails.
      # `-x` takes glob patterns: the old `backend/migrations` matched nothing,
      # because migrations live under backend/<app>/migrations/.
      - name: Bandit SAST report
        run: bandit -r backend/ -x '*/migrations/*,*/__pycache__/*' --skip B101 -f json -o bandit-report.json --exit-zero
      # Gate: fail on high-severity, high-confidence findings. Previously any
      # finding at all (even LOW) failed the job, so it was always red and the
      # report was never uploaded. There is no baseline and no B324 skip:
      # cache-key and fingerprint hashes pass usedforsecurity=False, so any
      # new weak hash used without it fails the gate.
      - name: Bandit gate (high severity, high confidence)
        run: bandit -r backend/ -x '*/migrations/*,*/__pycache__/*' --skip B101 -lll -iii
      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bandit-report
          path: bandit-report.json
          retention-days: 14
          if-no-files-found: ignore
      - name: Safety dependency check
        run: safety check -r backend/requirements.txt || true
        continue-on-error: true

  # The Playwright visual-snapshot and live-audit jobs ran against the
  # production site on every push and PR (production traffic and answer
  # attempts on the audit account each time) and never tested the PR's own
  # code. They now run on a schedule / on demand from
  # .github/workflows/production-audit.yml.

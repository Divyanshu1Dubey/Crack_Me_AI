version: 2
# One pull request per ecosystem per month (2026-11-07): version updates are grouped instead of one PR
# per package (seven PRs were open at once). Security updates still come as soon as GitHub reports them.
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      backend:
        patterns: ["*"]
    ignore:
      # Stay on the Django 5.2 LTS (security releases until April 2028); 6.x is an upgrade of its own.
      - dependency-name: "django"
        update-types: ["version-update:semver-major"]
      # moviepy 2.2.1 (video_engine) requires Pillow < 12, so Pillow 12+ and pdfplumber 0.11.10+
      # (which requires Pillow >= 12.2) cannot be installed: #68 failed with ResolutionImpossible.
      - dependency-name: "pillow"
        versions: [">=12"]
      - dependency-name: "pdfplumber"
        versions: [">=0.11.10"]
      # together 2.42+ (and 3.x) require filelock<4, but requirements.txt has filelock>=4: pip installs
      # together 2.36, and a newer floor cannot install (#68 and #70 failed with ResolutionImpossible).
      - dependency-name: "together"
        versions: [">=2.37"]
    labels:
      - dependencies
      - python

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      frontend:
        patterns: ["*"]
    ignore:
      # On 1.x since 2026-11-07 (1.x dropped the brand icons; ours are in components/icons/BrandIcons.tsx).
      # A new major can drop more icons the app imports: upgrade it by hand.
      - dependency-name: "lucide-react"
        update-types: ["version-update:semver-major"]
      # typescript-eslint does not support TypeScript 7 and a unit test uses the compiler API:
      # #67 failed lint and unit tests.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # Upgrade these by hand, with a check: the Next.js middleware imports @supabase/ssr (a load
      # failure there is an error on every page), Datadog 7 changes the RUM and logs SDKs, and
      # @types/node follows the Node version the site runs on.
      - dependency-name: "@supabase/ssr"
        versions: [">=0.11.0"]
      - dependency-name: "@datadog/browser-*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    labels:
      - dependencies
      - javascript

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    labels:
      - dependencies
      - ci
